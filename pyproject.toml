[project]
name = "tianshen-tokenizer"
version = "0.3.0"
description = "天神（Tianshen）：中文原生词空间——形（字形/词表）+ 音（拼音/注音/发声）+ 意（义素/深义），真三维 F⊕P⊕S（GPL-3.0 开源）"
requires-python = ">=3.10"
dependencies = [
    "sentencepiece>=0.2.0",
    "tokenizers>=0.20.0",
    "tiktoken>=0.8.0",
    "regex>=2024.5.15",
    "tqdm>=4.66.0",
    "pypinyin>=0.51.0",
]

[project.scripts]
zhprep = "src.corpus.preprocess:main"
zhtrain = "src.tokenizer.train:main"
zhbench = "eval.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
